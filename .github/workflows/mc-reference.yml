# Dev helper: extracts selected Minecraft/NeoForge sources for the current versions and pushes them
# to a temporary branch so they can be inspected without a local Gradle setup.
name: MC reference dump

on:
  workflow_dispatch:
    inputs:
      patterns:
        description: "Space-separated path regexes to extract from the sources/resources jars"
        required: true

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Create Minecraft artifacts
        run: ./gradlew :neoforge:createMinecraftArtifacts --stacktrace
      - name: Extract
        env:
          PATTERNS: ${{ inputs.patterns }}
        run: |
          mkdir -p /tmp/ref/out /tmp/ref/classes
          curl -sSLo /tmp/ref/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          MC=$(find neoforge/build/moddev -name 'minecraft-patched-*.jar' | head -1)
          NEO=$(find ~/.gradle/caches/modules-2 -name 'neoforge-*-sources.jar' | head -1)
          echo "MC=$MC NEO=$NEO" > /tmp/ref/out/_jars.txt
          unzip -Z1 "$MC" > /tmp/ref/mc.txt
          unzip -Z1 "$NEO" > /tmp/ref/neo.txt
          for p in $PATTERNS; do
            # Minecraft classes (incl. inner classes) -> decompile later; resources copied as-is
            grep -E "$p" /tmp/ref/mc.txt | grep -v '/$' | while read -r f; do
              case "$f" in
                *.class) unzip -o -q "$MC" "$f" -d /tmp/ref/classes ;;
                *) unzip -o -q "$MC" "$f" -d /tmp/ref/out ;;
              esac
            done
            grep -E "$p" /tmp/ref/mc.txt | grep '\.class$' | sed -E 's/\.class$//' | while read -r c; do
              unzip -o -q "$MC" "${c}\$*.class" -d /tmp/ref/classes 2>/dev/null || true
            done
            grep -E "$p" /tmp/ref/neo.txt | grep '\.java$' | while read -r f; do
              unzip -o -q "$NEO" "$f" -d /tmp/ref/out
            done
          done
          (cd /tmp/ref/classes && zip -q -r /tmp/ref/sel.jar .) || true
          if [ -f /tmp/ref/sel.jar ]; then
            java -jar /tmp/ref/vf.jar -e="$MC" /tmp/ref/sel.jar /tmp/ref/dec >/dev/null 2>&1 || true
            (cd /tmp/ref/out && unzip -o -q /tmp/ref/dec/sel.jar) || cp -r /tmp/ref/dec/* /tmp/ref/out/ || true
          fi
          find /tmp/ref/out -type f | sed 's|/tmp/ref/out/||' | sort > /tmp/ref/out/_files.txt
      - name: Push to temp branch
        run: |
          cd /tmp/ref/out
          git init -q -b mc-ref
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "MC reference dump"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mc-ref:mc-ref-tmp
