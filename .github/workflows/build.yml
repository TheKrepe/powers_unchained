name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: powers_unchained-jars
          path: |
            neoforge/build/libs/*.jar
            # fabric/build/libs/*.jar  (Fabric disabled for now)
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
