name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee /tmp/build.log

      # The build log is pushed to the 'ci-log' branch when the build fails, so it can be read
      # without access to the Actions log storage.
      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci-log && cd /tmp/ci-log
          cp /tmp/build.log build.log || echo "no log" > build.log
          echo "${{ github.sha }}" > commit.txt
          git init -q -b ci-log
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "Build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log:ci-log

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: powers_unchained-jars
          path: |
            neoforge/build/libs/*.jar
            # fabric/build/libs/*.jar  (Fabric disabled for now)
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error

      # Rolling pre-release 'dev' with the newest NeoForge jar of main: gives the owner a direct .jar download link.
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls neoforge/build/libs/*.jar | grep -v -e '-sources' -e '-javadoc' | head -1)
          gh release delete dev --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create dev "$JAR" -R "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Dev build" --notes "Latest build of main: ${{ github.sha }}"
