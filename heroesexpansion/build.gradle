buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "${minecraft_version}-${build_version}"
group= "lucraft.mods"
archivesBaseName = "HeroesExpansion"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20180814-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven {
        name = "DVS1 Maven FS"
        url = "http://dvs1.progwml6.com/files/maven"
    }
    maven {
        name = "CoFH Maven"
        url = "http://maven.covers1624.net"
    }
    maven {
        url = "https://jitpack.io"
    }
    maven {
        url = "https://maven.latmod.com/"
    }
    maven {
        url = "http://blamejared.com/maven"
    }
    maven {
        url "https://www.cursemaven.com"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compile fg.deobf("com.gitlab.lcoremodders:LucraftCore:${core_version}")

    compileOnly fg.deobf("slimeknights.mantle:Mantle:${mantle_version}") {
        exclude group: 'mezz.jei'
    }

    compileOnly fg.deobf("slimeknights:TConstruct:${tconstruct_version}") {
		exclude group: 'mezz.jei'
	}

    compileOnly fg.deobf("com.feed_the_beast.mods:FTBUtilities:${ftbutil_version}") {
        exclude group: 'me.ichun.mods.ichunutil'
        exclude group: 'info.journeymap:journeymap-api'
        exclude group: 'mod.chiselsandbits:chiselsandbits'
    }

    compileOnly fg.deobf("com.feed_the_beast.mods:FTBLib:${ftblib_version}") {
        exclude group: 'mezz.jei'
    }

    compileOnly fg.deobf("blusunrize:ImmersiveEngineering:0.12-+:deobf") {
        exclude group: 'mezz.jei'
    }

    compileOnly "curse.maven:jei-238222:${jei_version}"
}

// Create deobf dev jars
task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

artifacts {
    archives deobfJar
}

sourceSets {
    main { output.resourcesDir = output.classesDir }
}
