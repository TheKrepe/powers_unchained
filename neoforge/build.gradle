plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            // dev only: REI uses @OnlyIn, and NeoForge's warning screen for it would stop the CI client's quick play
            systemProperty('neoforge.warnings.onlyin.hide', 'true')
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        // Used only by the CI client test workflow (.github/workflows/client-test.yml).
        ciServer {
            server()
            gameDirectory = this.mkdir(this.file('runs/ciserver'))
            systemProperty('powers_unleashed.ci.server', 'true')
        }
        ciClient {
            client()
            gameDirectory = this.mkdir(this.file('runs/ciclient'))
            systemProperty('powers_unleashed.ci', 'true')
            programArguments.addAll('--quickPlaySingleplayer', 'ci', '--width', '1280', '--height', '720')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'REI'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

// Runtime-only mods for dev/CI runs, not exposed as dependencies of the published jar.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios is optional: compile against its API, and only run it in dev/CI (not a dependency of the jar).
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI / REI are optional too: Suit Creator recipes in their recipe screens (compat/jei, compat/rei).
    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.3-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    def viewer = project.findProperty('ci_recipe_viewer') ?: 'jei'
    if (viewer == 'jei') {
        localRuntime "mezz.jei:jei-26.3-neoforge:${jei_version}"
    } else if (viewer == 'rei') {
        localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
        localRuntime "dev.architectury:architectury-neoforge:22.0.5"  // REI pulls 22.0.3, which fails on this NeoForge
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
